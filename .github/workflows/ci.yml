name: Verify and deliver
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: maya-npm-bundle
          path: '*.tgz'
          retention-days: 7
  connected:
    needs: verify
    runs-on: ubuntu-latest
    env:
      MAYA_IMAGE: maya-connected-ci
      MAYA_ACCESS_TOKEN: ci-disposable-operator-key
      COMPANY_A_TOKEN: ci-disposable-company-a-key
      COMPANY_B_TOKEN: ci-disposable-company-b-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker build -t maya-connected-ci .
      - run: docker compose -f deploy/compose.yaml up --detach --wait --wait-timeout 120
      - run: npm run test:connected
      - name: Service diagnostics
        if: failure()
        run: docker compose -f deploy/compose.yaml logs --tail 80
      - name: Stop disposable integration services
        if: always()
        run: docker compose -f deploy/compose.yaml down --volumes
  deliver:
    needs: [verify, connected]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image identity
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
