name: maya-demo
services:
  company-a:
    image: ${COMPANY_A_IMAGE:-ghcr.io/jassi2004/transcend-company-a:c6e4648fdc9c91930f7b6fe9708424fb8f3571ac}
    restart: unless-stopped
    ports: ["127.0.0.1:${COMPANY_A_PORT:-4100}:4100"]
    environment:
      ENABLE_DEMO_FAULTS: "true"
      SANDBOX_TOKEN: ${COMPANY_A_TOKEN:?Run deploy/start.sh first}
    volumes: ["company-a-data:/data"]
  company-b:
    image: ${COMPANY_B_IMAGE:-ghcr.io/jassi2004/transcend-company-b:7f104f3ae9662fe5771ffc621cd97c6c3b18ebd3}
    restart: unless-stopped
    ports: ["127.0.0.1:${COMPANY_B_PORT:-4300}:4300"]
    environment:
      ENABLE_DEMO_FAULTS: "true"
      SANDBOX_TOKEN: ${COMPANY_B_TOKEN:?Run deploy/start.sh first}
    volumes: ["company-b-data:/data"]
  maya:
    image: ${MAYA_IMAGE:-ghcr.io/jassi2004/transcend-maya:latest}
    restart: unless-stopped
    ports: ["127.0.0.1:${MAYA_PORT:-4200}:4200"]
    depends_on:
      company-a: {condition: service_healthy}
      company-b: {condition: service_healthy}
    environment:
      MAYA_ACCESS_TOKEN: ${MAYA_ACCESS_TOKEN:?Run deploy/start.sh first}
      COMPANY_A_URL: http://company-a:4100
      COMPANY_A_TOKEN: ${COMPANY_A_TOKEN}
      COMPANY_B_URL: http://company-b:4300
      COMPANY_B_TOKEN: ${COMPANY_B_TOKEN}
    volumes: ["maya-data:/data"]
volumes:
  company-a-data:
  company-b-data:
  maya-data:
